version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: simokip-app:latest
    container_name: simokip-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - simokip-network

  nginx:
    image: nginx:alpine
    container_name: simokip-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - simokip-network
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: simokip-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: simokip
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: simokip
    ports:
      - "3308:3306"
    volumes:
      - simokip-mysql-data:/var/lib/mysql
    networks:
      - simokip-network

  node:
    image: node:22
    container_name: simokip-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/node_modules
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5173"
    networks:
      - simokip-network

networks:
  simokip-network:
    driver: bridge

volumes:
  simokip-mysql-data:
